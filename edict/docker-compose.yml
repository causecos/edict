# ══════════════════════════════════════════════════════
# Edict 三省六部 — 事件驱动架构 Docker Compose
# ══════════════════════════════════════════════════════
#
# 使用方式：
#   POSTGRES_PASSWORD=*** API_KEY=*** docker compose up -d
#
# 服务清单：
#   postgres      PostgreSQL 16 (数据持久化)
#   redis         Redis 7 (Streams / 缓存)
#   backend       FastAPI API 服务 (端口 8000)
#   orchestrator  编排 worker (状态流转 + 停滞检测)
#   dispatch      派发 worker (调用 Agent CLI)
#   outbox_relay  投递 worker (Outbox → Redis Streams)
#   frontend      React SPA (端口 3000)

services:
  # ── 基础设施 ──

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edict
      POSTGRES_USER: edict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edict"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend API ──

  backend:
    build:
      context: ..
      dockerfile: edict/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://edict:${POSTGRES_PASSWORD}@postgres:5432/edict
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ── Workers ──

  orchestrator:
    build:
      context: ..
      dockerfile: edict/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://edict:${POSTGRES_PASSWORD}@postgres:5432/edict
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.orchestrator_worker
    restart: unless-stopped

  dispatch:
    build:
      context: ..
      dockerfile: edict/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://edict:${POSTGRES_PASSWORD}@postgres:5432/edict
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../agents:/app/agents:ro
      - ../scripts:/app/scripts
      - ../data:/app/data
    command: python -m app.workers.dispatch_worker
    restart: unless-stopped

  outbox_relay:
    build:
      context: ..
      dockerfile: edict/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://edict:${POSTGRES_PASSWORD}@postgres:5432/edict
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.outbox_relay
    restart: unless-stopped

  # ── Frontend ──

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8000
      VITE_WS_URL: ws://backend:8000/ws
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
